<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Place an Order - Duskamz Farms</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #6D9773;
      font-family: 'Poppins', sans-serif;
    }
    header {
      background-color: #0C3B2E;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { color: #F7E7CE; font-size: 1.8em; }
    nav a {
      color: #F7E7CE; margin-left: 20px; text-decoration: none; font-weight: 500;
    }
    nav a:hover { color: #C8E3D4; }
    footer {
      background-color: #0C3B2E; color: #F7E7CE;
      text-align: center; padding: 15px; margin-top: 40px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Duskamz Farms</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="order.html">Order</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Order Form -->
  <main class="container my-5">
    <h2 class="text-center mb-4">Place Your Order</h2>
    <form id="orderForm" class="mx-auto" style="max-width:600px;">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="text" class="form-control" id="phone" required>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" required>
      </div>
      <div class="mb-3">
        <label for="product" class="form-label">Product</label>
        <input type="text" class="form-control" id="product" required>
      </div>
      <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" min="1" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Submit Order</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Duskamz Farms — All rights reserved.</p>
  </footer>

  <!-- WhatsApp Redirect Script -->
  <script>
  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;
    const product = document.getElementById("product").value;
    const quantity = document.getElementById("quantity").value;

    const message = `Hello, my name is ${name}. My phone is ${phone}, address: ${address}. I want to order ${quantity} units of ${product}.`;
    const whatsappNumber = "23275222227"; // Duskamz Farm contact
    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

    // Open WhatsApp in a new tab
    window.open(url, "_blank");

    // Redirect to confirmation page in the current tab
    window.location.href = "confirmation.html";
  });
</script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
