<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Duskamz Farms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color:#6D9773; font-family:'Poppins',sans-serif; }
    header { background-color:#0C3B2E; padding:15px 40px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { color:#F7E7CE; font-size:1.8em; }
    nav a { color:#F7E7CE; margin-left:20px; text-decoration:none; font-weight:500; }
    nav a:hover { color:#C8E3D4; }
    .contact-section { background-color:#C8E3D4; max-width:600px; margin:50px auto; padding:40px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
    .contact-section h2 { color:#0C3B2E; text-align:center; margin-bottom:20px; }
    label { display:block; margin-top:15px; color:#0C3B2E; font-weight:500; }
    input, textarea { width:100%; padding:10px; margin-top:5px; border:1px solid #0C3B2E; border-radius:6px; }
    button { background-color:#0C3B2E; color:#F7E7CE; border:none; padding:12px 25px; font-size:1em; border-radius:6px; cursor:pointer; margin-top:20px; width:100%; }
    button:hover { background-color:#0C2C47; }
    .social-links { text-align:center; margin-top:30px; }
    .social-links a { display:inline-block; background-color:#0C3B2E; color:#F7E7CE; padding:10px 20px; margin:5px; border-radius:6px; text-decoration:none; font-weight:500; }
    .social-links a:hover { background-color:#0C2C47; }
    footer { background-color:#0C3B2E; color:#F7E7CE; text-align:center; padding:15px; margin-top:40px; }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Duskamz Farm</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="order.html">Order</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <div class="contact-section">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <label for="name">Full Name:</label>
      <input type="text" id="name" required>
      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <label for="phone">Phone Number:</label>
      <input type="text" id="phone">
      <label for="message">Message:</label>
      <textarea id="message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <!-- Social Media Links -->
    <div class="social-links">
      <h3 style="color:#0C3B2E;">Connect with us:</h3>
      <a href="https://facebook.com/YourFarmPage" target="_blank">Facebook</a>
      <a href="https://instagram.com/YourFarmPage" target="_blank">Instagram</a>
      <a href="https://twitter.com/YourFarmPage" target="_blank">Twitter</a>
      <a href="https://wa.me/23275222227" target="_blank">WhatsApp</a>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Duskamz Farm — All rights reserved.</p>
  </footer>

  <!-- Optional JS to redirect messages to WhatsApp -->
  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const message = document.getElementById("message").value;

      const fullMessage = `Hello, my name is ${name}. My email is ${email}, phone: ${phone}. Message: ${message}`;
      const whatsappNumber = "23275222227"; // Duskamz Farms contact
      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(fullMessage)}`;

      window.open(url, "_blank");
    });
  </script>
</body>
</html>
